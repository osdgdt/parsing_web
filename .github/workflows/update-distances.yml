name: Aggiorna distanze comuni

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Geocodifica comuni e calcola distanze
        run: python scripts/update_distances.py

      - name: Commit ed eventuale push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add comuni.json
          git diff --cached --quiet || git commit -m "Aggiorna comuni.json (distanze geocodificate)"
          git push
