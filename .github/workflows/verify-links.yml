name: Verifica link annunci

on:
  push:
    branches: [main]
    paths: ['data.json']
  workflow_dispatch:

concurrency:
  group: verify-links
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verifica ogni link annuncio
        run: python scripts/verify_links.py

      - name: Commit ed eventuale push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Verifica link: pulizia automatica annunci non validi"
          git push
